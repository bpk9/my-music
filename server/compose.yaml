services:
  undertone:
    build: .
    restart: unless-stopped
    ports:
      - "${UNDERTONE_BIND_IP}:8448:8448"
    env_file: .env
    environment:
      MUSIC_ROOT: /music
      STATE_ROOT: /state
    volumes:
      - ${UNDERTONE_MUSIC_PATH}:/music:ro
      - ./state:/state
      - ./tls:/tls:ro
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8448/health',context=ssl._create_unverified_context(),timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
